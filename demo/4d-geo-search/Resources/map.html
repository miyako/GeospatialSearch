<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="referrer" content="strict-origin-when-cross-origin"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>html,body{margin:0;padding:0;height:100%;overflow:hidden}#map{width:100%;height:100%}</style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([31.7917, -7.0926], 5);
        map.attributionControl.setPrefix(false);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Leaflet',
            referrerPolicy: 'strict-origin-when-cross-origin'
        }).addTo(map);
        L.control.scale({ metric: true, imperial: false, maxWidth: 200 }).addTo(map);

        // Holds the markers/line so each update replaces the previous ones.
        var overlay = L.layerGroup().addTo(map);

        // Called from 4D via WA EXECUTE JAVASCRIPT FUNCTION.
        // data = { src: {coords:[lat,lng], label}, dst?: {coords:[lat,lng], label} }
        function updateMap(data) {
            overlay.clearLayers();
            if (!data || !data.src || !data.src.coords) { return; }

            var srcMarker = L.circleMarker(data.src.coords, {
                radius: 8,
                weight: 2,
                color: '#fff',
                fillColor: '#1e66ff',
                fillOpacity: 1
            }).addTo(overlay);

            if (data.src.label) {
                srcMarker.bindPopup(data.src.label, { autoClose: false, closeOnClick: false }).openPopup();
            }

            if (data.dst && data.dst.coords) {
                var dstMarker = L.circleMarker(data.dst.coords, {
                    radius: 8,
                    weight: 2,
                    color: '#fff',
                    fillColor: '#ff8040',
                    fillOpacity: 1
                }).addTo(overlay);

                var line = L.polyline([data.src.coords, data.dst.coords], {
                    color: '#444',
                    weight: 2,
                    dashArray: '6,6'
                }).addTo(overlay);

                if (data.dst.label) {
                    dstMarker.bindPopup(data.dst.label, { autoClose: false, closeOnClick: false }).openPopup();
                }
                map.fitBounds(line.getBounds(), { padding: [100, 100] });
            } else {
                map.setView(data.src.coords, 9);
            }
        }
        window.updateMap = updateMap;
    </script>
</body>
</html>
